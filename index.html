<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dropedo Leitstand</title>
<style>
:root { --bg: #f4f5f7; --panel: #ffffff; --fg: #15191f; --muted: #5b6573; --line: #d9dde3; --accent: #1e56b8; --bad: #b3261e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --panel: #181c22; --fg: #e8ebef; --muted: #9aa3ae; --line: #2a3038; --accent: #6b9cf0; --bad: #f07178; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 1.3rem; letter-spacing: .02em; text-transform: uppercase; }
p { margin: 0; color: var(--muted); font-size: .9rem; }
label { display: grid; gap: 6px; font-size: .9rem; }
input[type=password] { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
#msg { color: var(--bad); min-height: 1.2em; }
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Dropedo Leitstand</h1>
  <p>Bitte Passwort eingeben.</p>
  <label>Passwort<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
  <label class="check"><input type="checkbox" id="merk" checked> Auf diesem Gerät angemeldet bleiben</label>
  <button type="submit" id="go">Öffnen</button>
  <p id="msg" role="status"></p>
</form>
